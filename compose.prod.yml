# ═════════════════════════════════════════════════════════════════════════════
#  Panel de The Dude — PRODUCCIÓN
#
#    dude.db (SQLite)  ──ro──►  etl  ──►  postgres  ──►  web  ──►  caddy  ──► 🌐
#
#  Diferencias con `docker-compose.yml`, que es el de desarrollo:
#
#    · Las imágenes se BAJAN de GHCR, no se construyen. En la VM no hay
#      compilador, ni pnpm, ni ganas de esperar un `astro build`.
#    · La etiqueta es un COMMIT, no `latest`. Ver el comentario de PANEL_VERSION.
#    · `web` NO publica puerto al anfitrión. Ni siquiera en 127.0.0.1.
#    · Aparece `caddy`, que es lo único que toca la placa pública.
#
#  Se levanta con:  docker compose -f compose.prod.yml --env-file .env.prod up -d
#  El runbook completo está en `docs/PRODUCCION.md`. Leerlo antes.
# ═════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
#  🔴 POR QUÉ CADA IMAGEN VA FIJADA POR DIGEST Y NO POR ETIQUETA
#
#  Una etiqueta es un puntero mutable. Quien pueda publicar en el registro
#  reemplaza el contenido de `:2362d0e` y el próximo `docker compose pull` se
#  lo lleva EN SILENCIO: nada en la VM puede notar la diferencia.
#
#  Eso no es un riesgo teórico, es exactamente cómo pasó lo de SolarWinds en
#  2020: entraron al sistema de compilación, inyectaron código en Orion, y la
#  actualización salió FIRMADA, por el canal legítimo, a 18.000 organizaciones.
#  No hackearon 18.000 redes: hackearon al que las monitoreaba.
#
#  Y una herramienta de monitoreo es el blanco perfecto justamente porque
#  tiene credenciales de todo y acceso legítimo a todos lados. Este panel lee
#  la base de un ISP con 885 equipos y su topología completa.
#
#  Un digest es el hash del contenido. Si alguien reemplaza la imagen, el
#  `pull` FALLA en vez de obedecer — comprobado: con un digest que no coincide
#  Docker contesta `manifest unknown` y no arranca nada.
#
#  Va `nombre:etiqueta@digest` a propósito: la etiqueta queda legible para el
#  humano que lee este archivo, y el digest es el que manda.
#
#  🔴 Las de TERCEROS también. `postgres:16-alpine` y `caddy:2.11-alpine` son
#     etiquetas móviles que apuntan a una imagen nueva cada dos semanas. Fijar
#     sólo las nuestras sería cerrar la puerta y dejar la ventana.
#
#  Para actualizar: `./deploy/digests.sh`, que los lee del registro y escribe
#  las líneas. A mano se equivoca uno, y un digest mal copiado no arranca.
# ═════════════════════════════════════════════════════════════════════════════

name: dudepanel

services:

  # ── Base de datos ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine@${POSTGRES_DIGEST:?falta POSTGRES_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped

    # 🔴 SIN `ports:`. Y además está en una red `internal: true`, así que ni
    #    siquiera tiene salida a internet. Sólo la ven `etl` y `web`.
    #    Para mirarla a mano: `docker compose -f compose.prod.yml exec db psql -U dude`.

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dude}
      POSTGRES_USER: ${POSTGRES_USER:-dude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env.prod}
      # Checksums de página: detecta corrupción silenciosa de disco en vez de
      # servir datos rotos como si fueran buenos.
      POSTGRES_INITDB_ARGS: "--data-checksums"

    volumes:
      - db-data:/var/lib/postgresql/data
      # El esquema se aplica solo la primera vez que el volumen está vacío.
      #
      # ⚠️ Esto es lo ÚNICO que este archivo necesita del árbol del repositorio.
      #    Si `etl/schema.sql` no está al lado, la base arranca vacía y el ETL
      #    falla en la primera corrida con "relation does not exist".
      - ./etl/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dude} -d ${POSTGRES_DB:-dude}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Postgres necesita memoria compartida; el default de Docker (64 MB) le
    # queda chico y produce errores raros bajo carga.
    shm_size: 256mb

    # Postgres necesita escribir, así que no puede ir `read_only` — pero no
    # necesita adquirir privilegios nuevos, y no cuesta nada negárselo.
    security_opt: ["no-new-privileges:true"]

    networks: [interna]

    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Sincronización desde The Dude ───────────────────────────────────────────
  etl:
    # 🔴 Etiqueta de commit, NO `latest`.
    #
    #    `latest` es un puntero móvil: dos `docker compose pull` con un mes de
    #    diferencia traen cosas distintas y nada en el archivo lo registra.
    #    El día que haya que volver atrás, la pregunta "¿cuál andaba?" no tiene
    #    respuesta. Con el commit, el rollback es cambiar UN valor en
    #    `.env.prod` y `up -d`. Y el valor dice exactamente qué código es.
    image: ghcr.io/programadores-obreros/dudepanel-etl:${PANEL_VERSION:?falta PANEL_VERSION en .env.prod}@${ETL_DIGEST:?falta ETL_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dude}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dude}
      DUDE_DB: /origen/dude.db
      DUDE_FILES: /origen/files
      SYNC_INTERVAL: ${SYNC_INTERVAL:-30}

    volumes:
      # 🔴 `:ro` NO ES DECORATIVO. Del otro lado está el monitoreo de un ISP.
      #    El montaje de sólo lectura es la última barrera si el código falla.
      #
      #    ⚠️ Y NUNCA sobre NFS, CIFS ni virtiofs: SQLite depende de bloqueos
      #       POSIX confiables. Un BLOCK DEVICE de red (iSCSI, Ceph RBD, qcow2
      #       sobre NFS) sí sirve; un FILESYSTEM de red, no.
      - ${DUDE_DATA:?falta DUDE_DATA en .env.prod}:/origen:ro

      # 🔴 EL ÚNICO PUNTO ESCRIBIBLE DEL ETL, y no es opcional.
      #
      #    The Dude toma un lock EXCLUSIVE sobre su base al arrancar y NO LO
      #    SUELTA NUNCA: contra el archivo vivo, todo lector externo recibe
      #    `database is locked` para siempre. Así que cada corrida copia acá la
      #    base y su journal, lee la copia, y la borra.
      #
      #    Va un volumen y no el tmpfs de /tmp porque la copia pesa lo que pesa
      #    `dude.db` —hoy 43 MB, techo 2 GiB— y un tmpfs es RAM.
      #
      #    El volumen nace con el dueño que la imagen tiene en `/trabajo`
      #    (uid 10001, modo 700). Ver el `RUN mkdir` de `etl/Dockerfile`: sin
      #    eso Docker lo crea `root:root` y el ETL no puede escribir.
      - etl-trabajo:/trabajo

    # 🔴 SIN ESTO EL ETL NO LEE NADA. Y la solución obvia es la equivocada.
    #
    #    The Dude corre como root y su base queda `600 root:root`. El ETL corre
    #    como `dude` (uid 10001), así que se estrella con
    #    `PermissionError: /origen/dude.db` y reinicia cada 30 s para siempre.
    #    El panel levanta igual, con TLS y contraseña y todo — y sirve CERO
    #    equipos. Un fallo que se ve como un panel vacío, no como un error.
    #
    #    Las dos salidas fáciles son peores que el problema:
    #      · `chmod 644 dude.db` — esa base tiene el usuario y la contraseña de
    #        acceso a TODOS los routers del ISP, en claro. Legible para todo el
    #        mundo en la máquina, para que la lea UN proceso.
    #      · `user: root` en el ETL — tirar a la basura `cap_drop: ALL` y el
    #        usuario sin privilegios por un permiso de lectura.
    #
    #    Un grupo suplementario concede exactamente lo que hace falta y nada
    #    más: la base pasa a `640 root:dudepanel`, el grupo NO TIENE MIEMBROS
    #    HUMANOS, y el único que lo lleva puesto es este contenedor.
    #
    #      groupadd -g 3000 dudepanel
    #      chgrp dudepanel /srv/thedude/data /srv/thedude/data/dude.db*
    #      chmod 750 /srv/thedude/data && chmod 640 /srv/thedude/data/dude.db*
    #
    #    Va el GID numérico a propósito: dentro del contenedor no existe
    #    `/etc/group` con ese nombre, y Docker no lo resuelve contra el
    #    anfitrión. Un nombre acá falla al arrancar.
    group_add: ["${DUDE_GID:-3000}"]

    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    networks: [interna]

    logging: *logs

  # ── Camino: traceroute + ASN ────────────────────────────────────────────────
  #
  # 🔴 ES UN SERVICIO APARTE Y NO UN COMANDO DEL ETL. Por la RED.
  #
  #    El `etl` vive sólo en `interna`, que es `internal: true`. Trazar necesita
  #    mandar paquetes afuera. Medido adentro del `etl`:
  #    `[Errno 101] Network is unreachable`. No es una preferencia de diseño.
  #
  #    Y el `etl` se queda donde está: es el que abre la base con las
  #    credenciales de todos los routers, y ése no sale a internet ni por
  #    casualidad.
  camino:
    image: ghcr.io/programadores-obreros/dudepanel-etl:${PANEL_VERSION:?falta PANEL_VERSION en .env.prod}@${ETL_DIGEST:?falta ETL_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

    # El módulo traza y termina; el bucle va acá. `correr` sin destinos
    # registrados escribe una línea y sale con 0 — o sea que hasta que alguien
    # registre un destino esto NO MANDA UN SOLO PAQUETE. Arranca callado, y es
    # a propósito: un servicio nuevo que empieza a sondear solo es una sorpresa.
    #
    #   docker compose exec camino python /app/camino.py destino 8.8.8.8 --nota "..."
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          python -u /app/camino.py correr || echo "camino: la corrida falló, sigo"
          sleep "${CAMINO_INTERVALO_S:-900}"
        done

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dude}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dude}
      # Interruptor general de la consulta externa de ASN. Con `0` traza igual y
      # deja los saltos sin dueño: sirve para una red que no quiere hablar con
      # nadie de afuera ni siquiera para preguntar por una IP pública.
      CAMINO_ASN: ${CAMINO_ASN:-1}

    # 🔴 SIN `cap_add`. La técnica se eligió para esto.
    #
    #    Un traceroute clásico pide `CAP_NET_RAW`. Acá se usa UDP con
    #    `IP_RECVERR`, que lee los ICMP de vuelta por la cola de errores del
    #    propio socket y no necesita ningún privilegio. Medido con
    #    `--cap-drop ALL`: `SOCK_RAW` da `Operation not permitted` y esto anda.
    #
    #    El socket ICMP `SOCK_DGRAM` también andaba — pero sólo porque Docker
    #    deja `net.ipv4.ping_group_range` abierto de fábrica. En un anfitrión
    #    endurecido se rompe. Se descartó por eso.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    # `interna` para la base, `borde` para poder trazar. Es el único servicio
    # que necesita las dos por una razón de salida, no de entrada: nadie le
    # habla a `camino`, `camino` habla hacia afuera.
    networks: [interna, borde]

    logging: *logs

  # ── Sonda: ping, puertos y traceroute EN VIVO, a pedido ─────────────────────
  #
  # 🔴 ESTE SERVICIO CONVIERTE AL PANEL EN ACTOR DE LA RED.
  #
  #    Todo lo demás refleja lo que The Dude midió. Esto manda paquetes cuando
  #    alguien aprieta un botón. Los frenos están en `sonda.py` y son cuatro:
  #    sólo direcciones que ya están en `devices`, sólo seis puertos fijos,
  #    enfriamiento por destino más tope global, y jamás escribe en un equipo.
  #
  #    Va aparte del `etl` por la misma razón que `camino`: el ETL abre la base
  #    con las credenciales de todos los equipos del ISP, y ése no sale a
  #    internet. Y va aparte de `camino` porque `camino` corre solo en un bucle
  #    y esto atiende pedidos: dos ciclos de vida distintos en un contenedor es
  #    cómo se termina reiniciando el sondeo para arreglar el traceroute.
  sonda:
    image: ghcr.io/programadores-obreros/dudepanel-etl:${PANEL_VERSION:?falta PANEL_VERSION en .env.prod}@${ETL_DIGEST:?falta ETL_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    entrypoint: ["python", "-u", "/app/sonda.py"]

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dude}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dude}
      SONDA_ENFRIAMIENTO_S: ${SONDA_ENFRIAMIENTO_S:-10}
      SONDA_POR_MINUTO: ${SONDA_POR_MINUTO:-60}
      # 🔴 La comunidad SNMP va acá y NO en la base. En v1/v2c la comunidad es
      #    la contraseña, y la ficha del equipo promete que el panel no guarda
      #    contraseñas de equipos. `public` es lo que tiene esta instalación
      #    —medido en dude.db— pero el próximo ISP puede tener otra cosa.
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_VERSION: ${SNMP_VERSION:-1}

    # 🔴 EL SYSCTL VA EXPLÍCITO, no se confía en el defecto de Docker.
    #
    #    `net.ipv4.ping_group_range` es lo que permite abrir un socket ICMP sin
    #    `CAP_NET_RAW`. Docker lo deja abierto de fábrica — y ESO es la trampa:
    #    un anfitrión endurecido lo cierra, y entonces el ping se degrada a UDP
    #    en producción y no en desarrollo, que es el peor orden posible para
    #    enterarse. Declarándolo, la máquina de desarrollo y el servidor hacen
    #    lo mismo.
    #
    #    Medido con el rango cerrado: `sonda.py` cae solo a UDP con IP_RECVERR
    #    y mide 4,9-5,2 ms donde ICMP medía 4,77-5,43. Anda igual, y lo DICE en
    #    la respuesta — un «no contestó» por UDP y uno por ICMP no significan lo
    #    mismo.
    sysctls:
      net.ipv4.ping_group_range: "10001 10001"

    # 🔴 SIN `ports:`. Sólo lo alcanza el contenedor `web` por la red interna.
    #    Publicar esto sería regalar un escáner de la red de gestión.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.create_connection(('127.0.0.1',8099),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks: [interna, borde]

    logging: *logs

  # ── Panel web ───────────────────────────────────────────────────────────────
  web:
    image: ghcr.io/programadores-obreros/dudepanel-web:${PANEL_VERSION:?falta PANEL_VERSION en .env.prod}@${WEB_DIGEST:?falta WEB_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dude}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dude}
      # 🔴 Van los DOS nombres a propósito. El ETL lee `DUDE_FILES` y el panel
      #    lee `DUDE_FILES_DIR`. Cuando faltaba el segundo, los 56 iconos caían
      #    al de repuesto EN SILENCIO — 47 de ellos son PNG o JPG de los mapas
      #    reales. Un icono faltante es cosmético; 47 faltando sin decir nada
      #    es un panel que parece roto y no explica por qué.
      DUDE_FILES: /origen/files
      DUDE_FILES_DIR: /origen/files

      # 🔴 Dónde deja el ISP sus propias fotos de equipo, y por qué NO puede
      #    ser el directorio que viene adentro de la imagen.
      #
      #    Por omisión el panel las busca en `./dist/client/equipos`, que se
      #    hornea en tiempo de compilación. Ahí, dejar una foto obligaría a
      #    reconstruir y volver a publicar la imagen — o sea, el mecanismo de
      #    reemplazo no serviría para nada en el único lugar donde importa.
      #
      #    Con esta variable apuntando a un volumen, se copia el archivo, se
      #    espera hasta un minuto a que el índice se relea, y listo.
      FOTOS_EQUIPOS_DIR: /fotos
      # Adónde le pide el panel un sondeo en vivo. Sin esto definido, la ficha
      # del equipo NO ofrece los botones: es preferible que no aparezcan a que
      # aparezcan y fallen. Ver `web/src/lib/sonda.ts`.
      SONDA_URL: http://sonda:8099

      # 🔴 Quién puede acomodar los mapas. Sin esta línea la variable queda en
      #    `.env.prod` y NUNCA llega al proceso: Compose sólo pasa al
      #    contenedor lo que está declarado acá.
      #
      #    El fallo es silencioso del lado bueno —`lib/roles` falla cerrado y
      #    nadie puede escribir— pero igual es un fallo: el editor configurado
      #    recibe «no hay ningún editor configurado» y no tiene forma de saber
      #    que el problema es el compose y no su cuenta. Pasó en el primer
      #    despliegue de esta funcionalidad.
      PANEL_EDITORES: ${PANEL_EDITORES:-}

      HOST: 0.0.0.0
      PORT: 4321

    volumes:
      # 🔴 SÓLO `files/`, no el directorio entero. Montando `/origen` completo,
      #    `dude.db` quedaba legible dentro del espacio de nombres del panel —
      #    y el encabezado de este archivo afirma que no lo ve. Una afirmación
      #    de seguridad que no se cumple es peor que no hacerla: la próxima
      #    decisión se toma creyéndola.
      - ${DUDE_DATA:?falta DUDE_DATA en .env.prod}/files:/origen/files:ro

      # Las fotos propias del ISP. Volumen y no un directorio de la imagen: si
      # viviera adentro, dejar una foto exigiría reconstruir y republicar.
      #
      # `:ro` porque el panel sólo las LEE. Para cargar una:
      #   docker cp foto.webp dudepanel-web-1:/fotos/     ← no, es de sólo lectura
      #   docker run --rm -v dudepanel_fotos-equipos:/d -v "$PWD":/o alpine \
      #     cp /o/rb2011.webp /d/
      # Ver `docs/IMAGENES.md`.
      - fotos-equipos:/fotos:ro

    # 🔴 NO HAY `ports:` — y ésa es la diferencia central con el compose de
    #    desarrollo, donde el panel se publicaba en `127.0.0.1:4321`.
    #
    #    Ahora la única forma de llegarle es a través de Caddy, que es donde
    #    viven el TLS y la contraseña. Publicarlo aunque sea en el bucle local
    #    del anfitrión abriría un camino que esquiva las dos cosas: cualquiera
    #    con una sesión SSH y un túnel entra sin credenciales.
    #
    #    Para depurar sin exponerlo:
    #      docker compose -f compose.prod.yml exec web wget -qO- http://127.0.0.1:4321/

    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # `interna` para hablar con Postgres, `borde` para que lo alcance Caddy.
    # Postgres NO está en `borde`: si mañana Caddy tuviera un fallo de ejecución
    # remota, no tiene ni siquiera ruta de red hasta la base.
    networks: [interna, borde]

    logging: *logs

  # ── Puerta de entrada ───────────────────────────────────────────────────────
  caddy:
    # Menor fijado a mano. `caddy:2-alpine` seguiría a la 2.12, y una puerta de
    # internet no cambia de versión mayor sola un martes a la madrugada.
    image: caddy:2.11-alpine@${CADDY_DIGEST:?falta CADDY_DIGEST en .env.prod — ver deploy/digests.sh}
    restart: unless-stopped

    # `service_started` y no `service_healthy`: si el panel está caído queremos
    # que Caddy igual levante, porque es el que atiende el desafío ACME. Sin él
    # arriba, un panel roto también impide RENOVAR EL CERTIFICADO — un problema
    # se convierte en dos. Mientras tanto contesta 502, que es la verdad.
    depends_on: [web]

    environment:
      PANEL_DOMINIO: ${PANEL_DOMINIO:?falta PANEL_DOMINIO en .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env.prod}

    ports:
      # 0.0.0.0 A PROPÓSITO, y es el único servicio del conjunto que lo hace.
      #
      # 🔴 Antes de abrir estos puertos en el cortafuegos, leer la sección
      #    "Un puerto abierto es una puerta" de `docs/PRODUCCION.md`. No es
      #    literatura: en este mismo despliegue quedó un login de 2011 con
      #    TLSv1 atendiendo desde internet por exactamente este descuido.
      #
      # El 80 no es opcional aunque todo se sirva por 443: es por donde entra
      # el desafío HTTP-01 de Let's Encrypt. Cerrarlo "porque redirige nomás"
      # rompe la renovación, y se nota a los 60 días.
      - "80:80"
      - "443:443"
      # QUIC/HTTP3. Comentado a propósito: suma una superficie UDP que hay que
      # abrir también en el cortafuegos, y el panel no gana nada medible con
      # ella. Descomentar sólo si alguien lo pide con un número en la mano.
      # - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # 🔴 Y EL ARCHIVO DE USUARIOS, que el Caddyfile importa.
      #
      #    Sin esta línea Caddy no arranca: `File to import not found`. Y como
      #    Caddy es la ÚNICA puerta —el panel no publica puerto— eso es el
      #    sitio entero caído.
      #
      #    Se separó del Caddyfile porque el repositorio es público y ahí
      #    estaban las casillas reales del ISP. Vive sólo en el servidor, en
      #    600 root:root, y `git check-ignore` lo confirma ignorado.
      #
      #    Para el primer despliegue en una máquina nueva hay que CREARLO
      #    ANTES de levantar nada:
      #      cp usuarios.caddy.example usuarios.caddy && $EDITOR usuarios.caddy
      - ./usuarios.caddy:/etc/caddy/usuarios.caddy:ro
      # 🔴 `caddy-data` guarda la cuenta de ACME y los certificados. Borrarlo
      #    obliga a volver a pedir todo, y Let's Encrypt permite 5 certificados
      #    por dominio cada 7 días: con cinco arranques en falso el sitio se
      #    queda sin TLS una semana. NO va en el `down -v` de rutina.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy

    # Caddy escribe en /data, /config y /var/log/caddy, que son volúmenes: el
    # resto del sistema de archivos puede ir de sólo lectura sin molestarlo.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    cap_drop: [ALL]
    # La única excepción de todo el conjunto. La imagen oficial corre como root,
    # y aun así atarse al 80 y al 443 necesita esta capacidad puntual: son
    # puertos privilegiados. Se concede UNA, no se deja `cap_drop` sin poner.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

    # Pega contra la API de administración, que escucha sólo en el bucle local
    # del contenedor. No se puede usar el sitio real: está detrás de la
    # contraseña y contestaría 401, que es un fallo desde el punto de vista de
    # `wget` aunque signifique que todo anda bien.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks: [borde]

    logging: *logs

networks:
  # Sin salida a internet. `db` y `etl` no tienen nada que hacer afuera, y si
  # algún día un paquete de Python trae una sorpresa, no tiene por dónde
  # llamar a casa.
  interna:
    internal: true
  borde:

volumes:
  db-data:
  # Fotos de equipo cargadas por el ISP. Sobrevive a los despliegues: el
  # trabajo de conseguir y recortar una foto no se puede perder porque salió
  # una versión nueva del panel.
  fotos-equipos:
  # Copia de trabajo del ETL. Se borra al final de cada corrida, así que en
  # reposo está vacío — pero el volumen tiene que existir igual.
  etl-trabajo:
  caddy-data:
  caddy-config:
  caddy-logs:
